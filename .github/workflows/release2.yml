name: Release 2

on:
  push:
    tags:
      - 'v[0-9]+.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (v1, v1.0, or v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:

  # ============================================================
  # PREPARE RELEASE
  # ============================================================

  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-24.04

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Remove whitespace
          TAG="$(echo "$TAG" | xargs)"

          # Convert V1 / V1.2 / V1.2.3 -> v1 / v1.2 / v1.2.3
          TAG="${TAG/#V/v}"

          # Remove leading v for parsing
          VERSION="${TAG#v}"

          # Accept:
          # v1
          # v1.0
          # v1.0.0
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid version: $TAG"
            echo "Accepted examples:"
            echo "  v1"
            echo "  v1.0"
            echo "  v1.0.0"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"

          TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "Release version: $TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Create tag only for manual workflow
      # --------------------------------------------------------

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check whether tag already exists
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote."
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            echo "Creating release $TAG"

            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Kadugu $TAG" \
              --generate-notes
          fi


  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build ${{ matrix.name }}

    needs: prepare-release

    strategy:
      fail-fast: false

      matrix:
        include:

          # ----------------------------------------------------
          # Linux x86_64
          # ----------------------------------------------------

          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04

          # ----------------------------------------------------
          # Windows x86_64
          # ----------------------------------------------------

          - name: Windows x86_64
            target: x86_64-pc-windows-msvc
            os: windows-2025

          # ----------------------------------------------------
          # Android / Termux ARM64
          # ----------------------------------------------------

          - name: Termux Android ARM64
            target: aarch64-linux-android
            os: ubuntu-24.04


    runs-on: ${{ matrix.os }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v6


      # ========================================================
      # RUST
      # ========================================================

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      # ========================================================
      # ANDROID / TERMUX
      # ========================================================

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            --licenses || true

          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018"


      - name: Configure Android ARM64
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          NDK="${ANDROID_HOME}/ndk/27.2.12479018"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

          echo "CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

          echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build
        shell: bash
        run: |
          cargo build \
            --release \
            --target "${{ matrix.target }}"


      # ========================================================
      # PACKAGE LINUX
      # ========================================================

      - name: Package Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p release

          cp \
            "target/${{ matrix.target }}/release/kadugu" \
            "release/kadugu-linux-x86_64"

          tar -czf \
            kadugu-linux-x86_64.tar.gz \
            -C release \
            kadugu-linux-x86_64


      # ========================================================
      # PACKAGE WINDOWS
      # ========================================================

      - name: Package Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release

          Copy-Item `
            "target/${{ matrix.target }}/release/kadugu.exe" `
            "release/kadugu-windows-x86_64.exe"

          Compress-Archive `
            -Path "release/kadugu-windows-x86_64.exe" `
            -DestinationPath "kadugu-windows-x86_64.zip" `
            -Force


      # ========================================================
      # PACKAGE TERMUX
      # ========================================================

      - name: Package Termux
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          mkdir -p release

          cp \
            "target/${{ matrix.target }}/release/kadugu" \
            "release/kadugu-termux-arm64"

          tar -czf \
            kadugu-termux-arm64.tar.gz \
            -C release \
            kadugu-termux-arm64


      # ========================================================
      # UPLOAD LINUX
      # ========================================================

      - name: Upload Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "kadugu-linux-x86_64.tar.gz" \
            --repo "${{ github.repository }}" \
            --clobber


      # ========================================================
      # UPLOAD WINDOWS
      # ========================================================

      - name: Upload Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          gh release upload "$env:TAG" `
            "kadugu-windows-x86_64.zip" `
            --repo "${{ github.repository }}" `
            --clobber


      # ========================================================
      # UPLOAD TERMUX
      # ========================================================

      - name: Upload Termux
        if: matrix.target == 'aarch64-linux-android'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "kadugu-termux-arm64.tar.gz" \
            --repo "${{ github.repository }}" \
            --clobber
