name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (example: v1.0.0)'
        required: true
        type: string

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+.*$ ]]; then
            echo "Invalid version: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        include:

          # Linux PC
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          # Android / Termux ARM64
          - name: Termux Android ARM64
            target: aarch64-linux-android
            os: ubuntu-latest

          # macOS Intel
          - name: macOS x86_64
            target: x86_64-apple-darwin
            os: macos-latest

          # macOS Apple Silicon
          - name: macOS ARM64
            target: aarch64-apple-darwin
            os: macos-latest

          # Windows
          - name: Windows x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        if: matrix.target == 'aarch64-linux-android'
        run: |
          rustup target add aarch64-linux-android

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            --licenses || true

          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018"

      - name: Configure Android ARM64 linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK="${ANDROID_HOME}/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "PATH=$TOOLCHAIN/bin:$PATH" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kadugu
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
